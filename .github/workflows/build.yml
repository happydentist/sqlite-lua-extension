name: Build SQLite Lua Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev lua5.4 liblua5.4-dev

    - name: Build extension
      run: |
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-lua-extension
        path: |
          *.so
          *.dll
          *.dylib
