name: Build Static SQLite Lua Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === Windows 靜態編譯 ===
  build-windows-static:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-lua

    - name: Build Static DLL
      shell: msys2 {0}
      run: |
        # 1. 找出 liblua.a 靜態庫的精確路徑
        LUA_STATIC_LIB=$(find /mingw64/lib -name "liblua.a" | head -n 1)
        echo "Using Lua static lib: $LUA_STATIC_LIB"
        
        # 2. 跳過 Makefile，直接用 gcc 編譯延伸模組
        # -static-libgcc: 讓 DLL 不依賴 MinGW 系統庫
        # -Wl,--export-all-symbols: 確保 SQLite 能順利尋找到導出函數
        gcc -O2 -shared -o sqlite-lua.dll sqlite-lua.c \
          -I/mingw64/include \
          $LUA_STATIC_LIB \
          -static-libgcc \
          -Wl,--export-all-symbols

    - name: Upload Windows DLL
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-lua-extension-windows-static
        path: |
          *.dll
          README.md

  # === Linux 靜態編譯 ===
  build-linux-static:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev liblua5.3-dev

    - name: Build Static SO
      run: |
        # 1. 找出 Linux 環境下的 liblua5.3.a 靜態庫
        LUA_STATIC_LIB=$(find /usr/lib -name "liblua5.3.a" | head -n 1)
        echo "Using Lua static lib: $LUA_STATIC_LIB"
        
        # 2. 跳過 Makefile，直接用 gcc 編譯成 .so
        # -fPIC: 生成位置無關代碼（動態庫必備）
        gcc -O2 -shared -fPIC -o sqlite-lua.so sqlite-lua.c \
          -I/usr/include/lua5.3 \
          $LUA_STATIC_LIB

    - name: Upload Linux SO
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-lua-extension-linux-static
        path: |
          *.so
          README.md
