name: Fixed Static SQLite Lua Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === Windows 靜態編譯 ===
  build-windows-static:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-sqlite3

    - name: Download and Build Static Lua (Windows)
      shell: msys2 {0}
      run: |
        # 下載官方 Lua 5.3.6 原始碼以利安全編譯出帶有特殊參數的靜態庫
        curl -R -O http://lua.org
        tar zxf lua-5.3.6.tar.gz
        cd lua-5.3.6
        # 編譯出包含靜態資訊的目標檔
        make generic CC=gcc
        cd ..

    - name: Build Extension DLL
      shell: msys2 {0}
      run: |
        # 結合剛剛編譯出來的靜態庫檔案進行封裝
        gcc -O2 -shared -o sqlite-lua.dll sqlite-lua.c \
          -Ilua-5.3.6/src \
          -I/mingw64/include \
          lua-5.3.6/src/liblua.a \
          -static-libgcc \
          -Wl,--export-all-symbols

    - name: Upload Windows DLL
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-lua-extension-windows-static
        path: |
          *.dll
          README.md

  # === Linux 靜態編譯 ===
  build-linux-static:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev

    - name: Download and Build Static Lua with fPIC (Linux)
      run: |
        # 下載官方 Lua 原始碼並強制加上 -fPIC 參數編譯，否則 Linux 核心會拒絕打包
        curl -R -O http://lua.org
        tar zxf lua-5.3.6.tar.gz
        cd lua-5.3.6
        make linux MYCFLAGS="-fPIC"
        cd ..

    - name: Build Extension SO
      run: |
        # 直接連結產出的 liblua.a 靜態庫
        gcc -O2 -shared -fPIC -o sqlite-lua.so sqlite-lua.c \
          -Ilua-5.3.6/src \
          lua-5.3.6/src/liblua.a

    - name: Upload Linux SO
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-lua-extension-linux-static
        path: |
          *.so
          README.md
