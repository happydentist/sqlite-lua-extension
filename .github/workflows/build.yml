name: Ultimate Static Build SQLite Lua

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === Windows 靜態編譯 (獨立 DLL) ===
  build-windows-static:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-lua

    - name: Build Static DLL
      shell: msys2 {0}
      run: |
        # 1. 抓取系統內建的 liblua.a 靜態庫路徑
        LUA_LIB=$(find /mingw64/lib -name "liblua.a" | head -n 1)
        echo "Found Static Lua Lib: $LUA_LIB"
        
        # 2. 將輸入檔案修正為 lua.c，並輸出為 sqlite-lua.dll
        gcc -O2 -shared -o sqlite-lua.dll lua.c \
          -I/mingw64/include \
          -I/mingw64/include/lua5.3 \
          $LUA_LIB \
          -static-libgcc \
          -Wl,--export-all-symbols

    - name: Upload Windows DLL
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-lua-extension-windows-static
        path: |
          *.dll
          README.md

  # === Linux 靜態編譯 (獨立 SO) ===
  build-linux-static:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev liblua5.3-dev

    - name: Build Static SO
      run: |
        # 1. 抓取 Ubuntu 系統下的 liblua5.3.a 靜態庫位置
        LUA_LIB=$(find /usr/lib -name "liblua5.3.a" | head -n 1)
        echo "Found Static Lua Lib: $LUA_LIB"
        
        # 2. 將輸入檔案修正為 lua.c，並輸出為 sqlite-lua.so
        gcc -O2 -shared -fPIC -o sqlite-lua.so lua.c \
          -I/usr/include/lua5.3 \
          -Wl,-Bsymbolic \
          $LUA_LIB

    - name: Upload Linux SO
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-lua-extension-linux-static
        path: |
          *.so
          README.md
